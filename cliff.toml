[remote.github]
owner = "ahstn"
repo = "oceans-llm"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [{ pattern = '\s+\((\w+\s)?#[0-9]+\)\s*$', replace = "" }]
commit_parsers = [
  { footer = '^changelog: ?ignore', skip = true },
  { message = '^docs\(release\): update changelog for v', skip = true },
  { message = "^feat", group = "<!-- 0 -->:rocket: New features" },
  { message = "^fix", group = "<!-- 1 -->:bug: Bug fixes" },
  { message = "^(perf|refactor|revert|docs|chore)", group = "<!-- 2 -->Changed" },
  { message = "^(build|ci|style|test)", skip = true },
  { message = "^.*", group = "<!-- 2 -->Changed" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
exclude_paths = ["CHANGELOG.md", "README.md"]

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/2.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}
{% set_global seen_messages = [] -%}
{% set_global selected_commits = [] -%}
{% for commit in commits | reverse -%}
{% set message_key = commit.message | split(pat="\n") | first | lower -%}
{% if not seen_messages is containing(message_key) -%}
{% set_global seen_messages = seen_messages | concat(with=[message_key]) -%}
{% set_global selected_commits = selected_commits | concat(with=[commit.id]) -%}
{% endif -%}
{% endfor -%}
{% for commit in commits -%}
{% if selected_commits is containing(commit.id) -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{% endif -%}
{% endfor %}
{% endfor %}

{% if github %}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New Contributors
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor -%}
{% endif -%}
{% endif -%}
"""
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/tree/{{ release.version }}
{% endif -%}
{% else -%}
[unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true
render_always = true
