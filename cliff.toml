#:schema https://www.schemastore.org/git-cliff.json

[remote.github]
owner = "ahstn"
repo = "oceans-llm"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# The changelog lists pull requests, not individual commits. GitHub ends each pull
# request's merge commit subject with "(#123)". Commits inside a pull request and
# commits pushed straight to main have no such suffix, so no parser below matches
# them and `filter_commits` drops them. The same filter decides the version bump.
commit_parsers = [
  { footer = '^changelog: ?ignore', skip = true },
  { message = '^feat[^\n]*\(#[0-9]+\)[ \t]*(\n|$)', group = ":rocket: New features" },
  { message = '^fix[^\n]*\(#[0-9]+\)[ \t]*(\n|$)', group = ":bug: Bug fixes" },
  # Breaking pull requests stay visible even when their type is hidden below.
  { message = '^[^\n]*\(#[0-9]+\)[ \t]*(\n|$)', field = "breaking", pattern = '^true$', group = "Changed" },
  { message = '^(build|ci|style|test)', skip = true },
  { message = '^[^\n]*\(#[0-9]+\)[ \t]*(\n|$)', group = "Changed" },
]
filter_commits = true
# Breaking commits inside a pull request must not bypass the filter above. Mark the
# pull request title with `!` instead.
protect_breaking_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/2.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n
"""
body = '''
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version and previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% elif version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/tree/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]({{ self::remote_url() }}/compare/{{ previous.version }}...HEAD)
{% endif -%}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | upper_first }}
{% for commit in entry.commits -%}
{# Titles are untrusted: escape link and HTML syntax, keep backticks. -#}
{% set subject = commit.message | split(pat="\n") | first | trim -%}
{% set pr_number = subject | replace_regex(from='^.*\(#([0-9]+)\)$', to="$1") -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ subject | replace_regex(from='[ \t]*\(#[0-9]+\)$', to="") | replace_regex(from='[\[\]<>]', to='\$0') | upper_first }}
{%- if commit.remote.pr_author %} by @{{ commit.remote.pr_author }}{% elif commit.remote.username %} by @{{ commit.remote.username }}{% endif %} in [#{{ pr_number }}]({{ self::remote_url() }}/pull/{{ pr_number }})
{% endfor -%}
{% endfor -%}
{% if github and github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New Contributors
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor -%}
{% endif %}

'''
trim = true
render_always = true
