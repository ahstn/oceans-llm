#:schema https://mise.jdx.dev/schema/mise.json
# Repository-wide tools and cross-cutting tasks. Project tasks live next to their code
# (see config_roots); run them from anywhere with `mise run //<dir>:<task>`, or list
# everything with `mise tasks ls --all`.
min_version = "2026.9.16" # [monorepo.path_aliases]
monorepo_root = true

[settings]
# Required for [daemons].
experimental = true

[monorepo]
config_roots = [
  "actions/review-agent",
  "crates/admin-ui/web",
  "crates/gateway",
  "crates/gateway-store",
  "crates/oceans-cli",
  "deploy/helm",
  "docs",
  "tests/harness-integration",
]
# Keep a single mise.lock at the root for every project.
lockfile = true

# Short names: `mise run //ui:check` runs `//crates/admin-ui/web:check`.
[monorepo.path_aliases]
cli = "crates/oceans-cli"
gateway = "crates/gateway"
harness = "tests/harness-integration"
helm = "deploy/helm"
review-agent = "actions/review-agent"
store = "crates/gateway-store"
ui = "crates/admin-ui/web"

[tools]
rust = { version = "1.98.1", components = ["rustfmt", "clippy", "llvm-tools-preview"] }
"aqua:taiki-e/cargo-llvm-cov" = "0.8.7"
node = "lts"
bun = "1.4.2"
postgres = { version = "18", os = ["macos"] }
gh = "latest"
helm = "latest"
git-cliff = "latest"
cocogitto = "latest"
cargo-dist = "0.33.0"
cargo-release = "1.1.6"
actionlint = "1.7.12"
shellcheck = "0.11.0"
prek = "latest"

[env]
CARGO_TARGET_DIR = "$HOME/.cache/cargo/target/"
CARGO_BUILD_BUILD_DIR = "$HOME/.cache/cargo/build/{workspace-path-hash}"

# Local Postgres for development and Postgres-backed tests. Supervised by pitchfork
# through `mise daemons`; manage it with the `postgres:*` tasks in crates/gateway-store.
# Exports DATABASE_URL. `port = "auto"` keeps the default port in the primary checkout
# and offsets it in linked git worktrees.
[daemons.db]
preset = "postgres"
version = "18"
port = "auto"
options.database = "oceans_llm"

# Local development defaults. Never extend this from a task that can reach real data.
[task_templates.gateway-local.env]
OCEANS_API_KEY_SECRET_ENCRYPTION_KEY = "${OCEANS_API_KEY_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"

[task_templates.gateway-prod.env]
GATEWAY_CONFIG = "gateway.prod.yaml"
POSTGRES_URL = { required = true }

[tasks.install]
description = "Install or update tool versions from mise.toml"
run = "mise install"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.rust-fmt-check]
description = "Check Rust source formatting without modifying files"
run = "cargo fmt --all -- --check"

[tasks.rust-lint]
description = "Lint all Rust workspace targets"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.rust-build]
description = "Build all Rust workspace crates"
run = "cargo build --workspace"

[tasks.rust-test]
description = "Run all Rust workspace tests"
run = "cargo test --workspace"

[tasks.rust-check]
description = "Check formatting, lint, and test the Rust workspace"
depends = ["rust-fmt-check", "rust-lint", "rust-test"]

[tasks.gateway-config-coverage]
description = "Require 90% line coverage for gateway configuration production code"
run = "scripts/check-gateway-config-coverage.sh"

[tasks.admin-contract-generate]
description = "Generate the checked-in admin OpenAPI artifact and TypeScript contract"
depends = ["//crates/admin-ui/web:install"]
run = [
  "cargo run -p gateway --bin export_admin_openapi -- crates/gateway/openapi/admin-api.json",
  "bun run --cwd crates/admin-ui/web generate:admin-api",
]

[tasks.admin-contract-check]
description = "Verify generated admin contract artifacts are up to date"
depends = ["//crates/admin-ui/web:install"]
run = """
tmpdir="$(mktemp -d)"
trap 'rm -rf "$tmpdir"' EXIT

cargo run -p gateway --bin export_admin_openapi -- "$tmpdir/admin-api.json"
bun run --cwd crates/admin-ui/web openapi-typescript "$tmpdir/admin-api.json" -o "$tmpdir/admin-api.ts"

diff -u crates/gateway/openapi/admin-api.json "$tmpdir/admin-api.json"
diff -u crates/admin-ui/web/src/generated/admin-api.ts "$tmpdir/admin-api.ts"
"""

[tasks.lint]
description = "Run repository formatting checks, linting, and static checks"
depends = [
  "rust-fmt-check",
  "rust-lint",
  "//crates/admin-ui/web:fmt-check",
  "//crates/admin-ui/web:lint",
  "//actions/review-agent:typecheck",
  "//actions/review-agent:lint",
  "//tests/harness-integration:typecheck",
]

[tasks.build]
description = "Build Rust crates and admin UI bundle"
depends = ["rust-build", "//crates/admin-ui/web:build"]

[tasks.test]
description = "Run repository unit tests"
depends = [
  "rust-test",
  "//crates/admin-ui/web:test",
  "//actions/review-agent:test",
  "copilot-installation-canary-test",
  "e2e-stack-test",
]

[tasks.e2e-stack-test]
description = "Verify E2E cleanup failures retain retry state"
run = "node --test scripts/start-e2e-stack.test.mjs"

[tasks.guardrail-release-gate]
description = "Run guardrail security, load, harness, and end-to-end release gates"
depends = [
  "//crates/admin-ui/web:build",
  "//crates/admin-ui/web:e2e:install",
  "//crates/gateway:build",
  "//tests/harness-integration:install",
]
run = [
  "cargo test -p gateway-guardrails",
  "cargo test -p gateway-store decision_event_persistence_load_gate_stays_within_release_budget",
  "npm run test --prefix tests/harness-integration -- guardrails-hook.test.ts",
  "E2E_GATEWAY_PORT=49380 E2E_UI_PORT=49381 E2E_UPSTREAM_PORT=49382 E2E_BASE_URL=http://127.0.0.1:49380 bun run --cwd crates/admin-ui/web playwright test e2e/guardrails.e2e.ts",
]

# Stack tasks: GATEWAY_PORT is the gateway listener, UI_PORT the admin UI server the gateway
# proxies /admin* to. Override both to run two worktrees side by side.
[tasks.dev-stack]
description = "Run the local dev stack (gateway + admin UI dev server); override with GATEWAY_PORT and UI_PORT"
extends = "gateway-local"
depends = ["//crates/admin-ui/web:install"]
env = { GATEWAY_PORT = "${GATEWAY_PORT:-8080}", UI_PORT = "${UI_PORT:-3001}", AGENT_ANALYSIS_SHADOW_DIAGNOSTICS_ENABLED = "${AGENT_ANALYSIS_SHADOW_DIAGNOSTICS_ENABLED:-true}" }
run = """
trap 'kill $(jobs -p) 2>/dev/null' EXIT
export OCEANS_PROVIDER_CREDENTIAL_ENCRYPTION_KEY="${OCEANS_PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-$(scripts/local-provider-credential-key.sh)}"

cargo run -p gateway --bin gateway -- seed-local-demo
PORT="$UI_PORT" bun run --cwd crates/admin-ui/web dev &
PORT="$GATEWAY_PORT" ADMIN_UI_UPSTREAM="http://localhost:$UI_PORT" cargo run -p gateway --bin gateway -- serve
"""

[tasks.prod-stack]
description = "Run the production-shaped local stack (gateway + admin UI SSR server); override with GATEWAY_PORT and UI_PORT"
extends = "gateway-prod"
depends = ["//crates/admin-ui/web:install"]
env = { GATEWAY_PORT = "${GATEWAY_PORT:-8080}", UI_PORT = "${UI_PORT:-3001}" }
run = """
trap 'kill $(jobs -p) 2>/dev/null' EXIT

PORT="$UI_PORT" bun run --cwd crates/admin-ui/web start &
PORT="$GATEWAY_PORT" ADMIN_UI_UPSTREAM="http://localhost:$UI_PORT" cargo run -p gateway --bin gateway -- serve
"""

[tasks."skills:import-bundled"]
description = "Import curated skills using a user-owned API key and the requested namespace"
depends = ["//crates/oceans-cli:build"]
run = "node scripts/import-bundled-skills.mjs"

[tasks.copilot-installation-canary-test]
description = "Test the GitHub Copilot installation-token canary without external credentials"
run = "node --test scripts/copilot-installation-canary.test.mjs"

[tasks.copilot-installation-canary]
description = "Run the opt-in live GitHub Copilot installation-token canary"
run = "node scripts/copilot-installation-canary.mjs"

[tasks.release]
description = "Prepare a release and push its source for CI publication"
depends = ["//crates/gateway:sync-pricing-catalog"]
env = { GITHUB_TOKEN = { required = true } }
run = '''
cog bump --auto --skip-untracked
tag="$(cog --verbose get-version --tag)"
git push --atomic origin main "$tag"
'''

[tasks.dist-generate]
description = "Regenerate the cargo-dist release workflow"
run = "dist generate"

[tasks.dist-check]
description = "Check generated release CI and lint release workflows"
run = [
  "dist generate --check",
  # Check generated shell commands without applying repository shell style rules.
  "actionlint -shellcheck= .github/workflows/release.yml",
  "actionlint .github/workflows/release-product.yml .github/workflows/release-cli-check.yml",
  "shellcheck scripts/check-cli-release.sh",
]

[tasks.dist-plan]
description = "Show the CLI archives and installers for the current version"
run = "dist plan"

[tasks.dist-build]
description = "Build CLI distribution artifacts for the local platform"
run = "dist build"
