server:
  bind: "0.0.0.0:8080"
  log_format: "pretty"

database:
  kind: postgres
  url: env.POSTGRES_URL

auth:
  bootstrap_admin:
    enabled: true
    email: admin@local
    password: literal.admin
    require_password_change: true

permissions:
  users:
    pages:
      - api_keys
      - models
      - usage_costs
      - leaderboard
      - agent_harnesses
      - request_logs
      - mcp_invocations
      - teams
      - users
      - service_accounts
    actions:
      - create_api_key
      - update_api_key
      - revoke_api_key
    default_page: usage_costs
  team_admins:
    pages: []
    actions:
      - reveal_api_key
    default_page: usage_costs
  platform_admins:
    pages:
      - mcp
      - review_agent
      - spend_controls
    actions: []
    default_page: api_keys

guardrails:
  default:
    enabled: true
    mode: audit
    packs:
      - core.shell
      - core.git
      - core.filesystem
      - database.postgresql
      - database.snowflake
      - secrets.aws_secrets
      - secrets.onepassword
      - cloud.aws
      - cloud.gcp
      - kubernetes.kubectl
      - kubernetes.helm
      - saas.github
      - saas.notion
    managed_checks: []
    stream_buffer_bytes: 4194304
    stream_buffer_timeout_ms: 120000
  managed_checks: {}
  model_routes: {}
  mcp_servers: {}

request_logging:
  payloads:
    capture_mode: redacted_payloads
    request_max_bytes: 131072
    response_max_bytes: 65536
    stream_max_events: 128
    redaction_paths: []

agent_analysis:
  enabled: true
  shadow_diagnostics_enabled: false
  calibrated_score_enabled: false
  calibration_approval_id: null
  team_admin_enabled: false
  report_retention_days: 90
  queue_retention_days: 7
  context_input_boundary_tokens: 220000
  context_reserved_output_tokens: 128000
  context_penalty_points_per_repeated_excess: 2
  metrics:
    tokens: true
    cache: true
    context: true
    tools: true
    skills: true
    reliability: true
    outcomes: true
    finish_reasons: true
  cache_profiles: []

providers:
  - id: openai-prod
    type: openai_compat
    base_url: https://api.openai.com/v1
    pricing_provider_id: openai
    auth:
      kind: bearer
      token: env.OPENAI_API_KEY

  - id: openai-secondary
    type: openai_compat
    base_url: https://api.openai.com/v1
    pricing_provider_id: openai
    auth:
      kind: bearer
      token: env.OPENAI_API_KEY_SECONDARY

  - id: vertex-adc
    type: gcp_vertex
    project_id: your-gcp-project
    location: global
    auth:
      mode: adc

  - id: vertex-claude
    type: gcp_vertex
    project_id: your-gcp-project
    location: global
    auth:
      mode: service_account
      credentials_path: /path/to/service-account.json

models:
  - id: openai-fast-v2
    description: GPT-6 Astra via OpenAI with weighted route selection; use Responses for tools
    routes:
      - provider: openai-prod
        upstream_model: gpt-6-astra
        weight: 9.0
      - provider: openai-secondary
        upstream_model: gpt-6-astra
        weight: 1.0

  - id: openai-fast
    description: Alias kept for backward compatibility
    alias_of: openai-fast-v2

  - id: gemini-fast
    description: Gemini on Vertex
    routes:
      - provider: vertex-adc
        upstream_model: google/gemini-2.0-flash

  - id: claude-sonnet
    description: Claude on Vertex
    routes:
      - provider: vertex-claude
        upstream_model: anthropic/claude-sonnet-4-6
