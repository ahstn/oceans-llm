#:schema https://mise.jdx.dev/schema/mise.json
# Native coding-harness integration tests. From the repo root: `mise run //tests/harness-integration:<task>`.

[tasks.install]
description = "Install native coding-harness integration test dependencies"
sources = ["package-lock.json", "package.json"]
outputs = ["node_modules/.package-lock.json"]
run = [
  "npm ci",
  "bun node_modules/@opencode/cli/postinstall.mjs",
  "node node_modules/@anthropic-ai/claude-code/install.cjs",
]

[tasks.typecheck]
description = "Typecheck native coding-harness integration tests"
depends = ["install"]
run = "npm run typecheck"

[tasks.test]
description = "Run the OpenCode, Pi, OMP and Claude Code live integration tests through Oceans"
depends = ["install"]
run = "npm test"

[tasks.matrix-test]
description = "Run only the harness x model x test matrix through Oceans and OpenRouter"
depends = ["install"]
run = "npm test -- src/matrix.test.ts"

[tasks.plugin-test]
description = "Verify packed Oceans discovery plugin with live OpenAI and Anthropic models through OpenRouter"
depends = ["install"]
run = "npm test -- src/opencode-plugin.test.ts"
