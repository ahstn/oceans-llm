# Link checking for `mise run links-check` (local links only) and
# `mise run links-check-external` (also fetches remote URLs).
# Walk .agents/ and .github/ too; .gitignore still applies.
hidden = true
exclude_path = ["(^|/)\\.git/", "(^|/)videos/", "(^|/)gha-research/", "node_modules"]
# Local servers and example hosts in guides are not reachable from CI.
exclude_loopback = true
exclude = ["^https?://(www\\.)?example\\.(com|org)"]
include_fragments = "anchor-only"
