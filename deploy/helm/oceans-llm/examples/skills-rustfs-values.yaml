database:
  external:
    existingSecret:
      name: oceans-llm-postgres

gateway:
  config:
    skills:
      enabled: true
      storage:
        bucket: oceans-skills
        region: us-east-1
        endpoint: http://oceans-skills-rustfs:9000
        prefix: skills/
        force_path_style: true
        allow_http: true
        access_key_id: env.OCEANS_SKILLS_S3_ACCESS_KEY_ID
        secret_access_key: env.OCEANS_SKILLS_S3_SECRET_ACCESS_KEY
      limits:
        max_archive_bytes: 10485760
        max_expanded_bytes: 26214400
        max_files: 1000
  extraEnvFrom:
    - secretRef:
        name: oceans-skills-s3

rustfs:
  enabled: true
  # Keep this service name and gateway.config.skills.storage.endpoint aligned.
  fullnameOverride: oceans-skills-rustfs
  mode:
    standalone:
      enabled: false
    distributed:
      enabled: true
  replicaCount: 4
  drivesPerNode: 1
  secret:
    # Administrative credentials; never mount this Secret in the gateway.
    existingSecret: oceans-skills-rustfs-root
  localEndpointHost:
    # The existing Secret contains credentials only, with no runtime overrides.
    autoInject: true
  storageclass:
    # Replace with an existing CSI-backed StorageClass in your cluster.
    name: skills-csi
    dataStorageSize: 20Gi
    logStorageSize: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  pdb:
    create: true
    maxUnavailable: 1
  config:
    rustfs:
      obs_environment: production
