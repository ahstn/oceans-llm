# Development profile. This has no RustFS node redundancy.
database:
  external:
    existingSecret:
      name: oceans-llm-postgres

gateway:
  config:
    skills:
      enabled: true
      storage:
        bucket: oceans-skills
        region: us-east-1
        endpoint: http://oceans-skills-rustfs:9000
        prefix: skills/
        force_path_style: true
        allow_http: true
        access_key_id: env.OCEANS_SKILLS_S3_ACCESS_KEY_ID
        secret_access_key: env.OCEANS_SKILLS_S3_SECRET_ACCESS_KEY
      limits:
        max_archive_bytes: 10485760
        max_expanded_bytes: 26214400
        max_files: 1000
  extraEnvFrom:
    - secretRef:
        name: oceans-skills-s3

rustfs:
  enabled: true
  fullnameOverride: oceans-skills-rustfs
  replicaCount: 1
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  secret:
    existingSecret: oceans-skills-rustfs-root
  storageclass:
    name: skills-csi
    dataStorageSize: 10Gi
    logStorageSize: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
