database:
  mode: external
  external:
    existingSecret:
      name: oceans-llm-postgres
      key: POSTGRES_URL

secrets:
  existingSecret:
    name: oceans-llm-env

gateway:
  config:
    server:
      bind: "0.0.0.0:8080"
      log_format: "json"
    database:
      kind: postgres
      url: env.POSTGRES_URL
    auth:
      bootstrap_admin:
        enabled: false
        email: admin@local
        password: env.GATEWAY_BOOTSTRAP_ADMIN_PASSWORD
        require_password_change: true
    providers:
      openai-prod:
        type: openai_compat
        base_url: https://api.openai.com/v1
        auth:
          token: env.OPENAI_API_KEY
    models:
      openai-fast:
        route:
          provider: openai-prod
          upstream_model: gpt-5
