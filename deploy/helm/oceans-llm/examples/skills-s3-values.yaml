database:
  external:
    existingSecret:
      name: oceans-llm-postgres

gateway:
  config:
    skills:
      enabled: true
      storage:
        bucket: oceans-skills
        region: us-east-1
        prefix: skills/
        force_path_style: false
        allow_http: false
        access_key_id: env.OCEANS_SKILLS_S3_ACCESS_KEY_ID
        secret_access_key: env.OCEANS_SKILLS_S3_SECRET_ACCESS_KEY
      limits:
        max_archive_bytes: 10485760
        max_expanded_bytes: 26214400
        max_files: 1000
  extraEnvFrom:
    - secretRef:
        name: oceans-skills-s3

# For AWS workload identity, omit the credential references and extraEnvFrom
# above, and configure serviceAccount.annotations for the cluster's identity.
