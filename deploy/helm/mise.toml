# Helm chart tasks. From the repo root: `mise run //deploy/helm:<task>`.

[env]
# A chart-local repository list, so these tasks never edit the user's Helm settings.
HELM_REPOSITORY_CONFIG = "{{config_root}}/.local/helm/repositories.yaml"
HELM_REPOSITORY_CACHE = "{{config_root}}/.local/helm/cache"

[tasks.repo]
description = "Register the chart dependency repository"
hide = true
run = "helm repo add --force-update rustfs https://charts.rustfs.com"

[tasks.deps]
description = "Build chart dependencies from the checked-in lock"
depends = ["repo"]
sources = ["oceans-llm/Chart.lock"]
outputs = ["oceans-llm/charts/*.tgz"]
run = "helm dependency build oceans-llm --skip-refresh"

[tasks."deps:update"]
description = "Update chart dependencies and Chart.lock"
depends = ["repo"]
run = "helm dependency update oceans-llm"

[tasks.lint]
description = "Lint the chart"
depends = ["deps"]
run = "helm lint oceans-llm --set database.external.existingSecret.name=oceans-llm-postgres"

# Renders the defaults and every example once, and validates each render with
# kubeconform. Schemas are pinned to KUBE_VERSION, the oldest Kubernetes minor
# still supported upstream; CRDs (CloudNativePG, External Secrets) use
# datreeio/CRDs-catalog pinned to a commit.
[tasks.template]
description = "Render the chart defaults and every example, and validate them against Kubernetes schemas"
depends = ["deps"]
env = { KUBE_VERSION = "1.35.9" }
run = """
crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{ "{{" }}.Group}}/{{ "{{" }}.ResourceKind}}_{{ "{{" }}.ResourceAPIVersion}}.json'
render() { helm template oceans-llm oceans-llm --kube-version "$KUBE_VERSION" "$@"; }
validate() {
  kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" \
    -schema-location default -schema-location "$crds"
}
render --set database.external.existingSecret.name=oceans-llm-postgres | validate
for values in oceans-llm/examples/*.yaml; do
  echo "$values"
  render --values "$values" | validate
done
"""

[tasks.skills-check]
description = "Verify skill storage and optional RustFS chart configuration"
depends = ["deps"]
run = "bash check-skills.sh"

[tasks.check]
description = "Lint, render, and validate the chart"
depends = ["lint", "template", "skills-check"]
