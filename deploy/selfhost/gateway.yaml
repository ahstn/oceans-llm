# Gateway config for the self-hosted (mise daemons) deployment.
# Loopback bind only: put a reverse proxy or `tailscale serve` in front. Secrets
# come from `mise.selfhost.local.toml` (see docs/setup/self-hosting-mise-daemons.md).
server:
  bind: "127.0.0.1:8080"
  log_format: "json"

database:
  kind: postgres
  url: env.POSTGRES_URL

auth:
  bootstrap_admin:
    enabled: true
    email: admin@local
    password: env.GATEWAY_BOOTSTRAP_ADMIN_PASSWORD
    require_password_change: true

request_logging:
  payloads:
    capture_mode: redacted_payloads
    request_max_bytes: 131072
    response_max_bytes: 65536
    stream_max_events: 128
    redaction_paths: []

teams:
  - id: platform
    name: Platform

service_accounts:
  - id: default
    name: Default
    team: platform
    budget:
      cadence: monthly
      amount_usd: "100.0000"
      hard_limit: true
      timezone: UTC
    keys:
      - id: default
        name: Default
        value: env.GATEWAY_API_KEY

# Replace with the providers and models you actually use. Reference
# docs/configuration/configuration-reference.md for every provider type.
providers:
  - id: openai-prod
    type: openai_compat
    base_url: https://api.openai.com/v1
    pricing_provider_id: openai
    auth:
      kind: bearer
      token: env.OPENAI_API_KEY

models:
  - id: openai-fast
    description: OpenAI default route
    routes:
      - provider: openai-prod
        upstream_model: gpt-6-astra
