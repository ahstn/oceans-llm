#:schema https://www.schemastore.org/gitleaks.json
# gitleaks secret scanning (`mise run secrets-check`). Extends the default rules.
# Each allowlist names an exact fixture value, never a path or field name, so a
# real secret in the same file or field is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Provider and model identifiers in demo seeds and store tests"
targetRules = ["generic-api-key"]
regexes = ['''^(bedrock-us-east-1|claude-3-5-sonnet)$''']

[[allowlists]]
description = "Placeholder gateway keys in docs and config tests"
regexes = [
  '''^gwk_(abcd1234\.(secret-one|secret-value|XYZ\.\.\.)|wxyz9876\.secret-two|0f3c9a\.s3cr3t)$''',
]

[[allowlists]]
description = "Throwaway RSA key shared by the token and Copilot tests"
targetRules = ["private-key"]
regexes = ['''MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQCo1WHWzHdosbKK''']

[[allowlists]]
description = "Fake tokens in redaction tests, and a docs comment in a since-removed bundled dependency"
regexes = [
  '''^glpat-0123456789abcdefghij$''',
  '''^xoxb-1234567890-1234567890-''',
  '''^abc123xyz456$''',
]
