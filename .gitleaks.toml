#:schema https://www.schemastore.org/gitleaks.json
# gitleaks secret scanning (`mise run secrets-check`). Extends the default rules;
# the allowlists cover fixtures and identifiers the default rules mistake for
# secrets. Keep them narrow: a path allowlist hides every rule in that file.

[extend]
useDefault = true

[[allowlists]]
description = "Provider and model identifiers, such as `provider_key: \"bedrock-us-east-1\"`"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''\b(provider|model)_key\b''']

[[allowlists]]
description = "Placeholder keys in docs, tests, and a since-removed bundled dependency comment"
regexes = ['''gwk_(abcd1234|wxyz9876|0f3c9a)\.''', '''\babc123xyz456\b''']

[[allowlists]]
description = "Throwaway RSA keys in provider token tests"
targetRules = ["private-key"]
paths = [
  '''^crates/gateway-providers/src/token\.rs$''',
  '''^crates/gateway-providers/src/copilot/tests\.rs$''',
]

[[allowlists]]
description = "Fake tokens in secret-redaction tests and audit-log redaction fixtures"
paths = [
  '''^crates/gateway-guardrails/src/redaction/tests\.rs$''',
  '''^crates/gateway-service/src/admin_audit\.rs$''',
]
regexes = ['''glpat-0123456789abcdefghij''', '''xox[bp]-''']
condition = "AND"
