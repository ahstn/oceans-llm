#:schema https://mise.jdx.dev/schema/mise.json
# Self-hosting overlay. Loaded only when the `selfhost` config environment is active
# (MISE_ENV=selfhost or `.miserc.local.toml` with env = ["selfhost"]), so developer
# machines and CI never see these daemons.
# Secrets come from fnox. The gitignored `mise.selfhost.local.toml` is for non-secret
# machine-specific overrides only.
# Runbook: https://oceans-llm.com/setup/self-hosting/
# Optional local Skills storage: add the `rustfs,selfhost-rustfs` environments.
# Mask these values in captured task output. Applies to `required` variables too.

redactions = [
  "OCEANS_API_KEY_SECRET_ENCRYPTION_KEY",
  "GATEWAY_BOOTSTRAP_ADMIN_PASSWORD",
  "GATEWAY_API_KEY",
  "OPENROUTER_API_KEY",
]

[tools]
# Provides pg_dump for pre-deploy backups; matches the postgres daemon preset.
postgres = "18"

# Replaces the base `db` daemon entirely: fixed port (no worktree offset) and start at boot.
[daemons.db]
preset = "postgres"
version = "18"
port = 5432
options.database = "oceans_llm"
boot_start = true

[daemons.admin-ui]
run = "cd crates/admin-ui/web && HOST=127.0.0.1 exec bun server.ts"
port = 3001
ready_port = 3001
depends = ["gateway"]
boot_start = true
retry = 3
proxy = false

[daemons.gateway]
run = '''
unset EXA_API_KEY GATEWAY_ADMIN_PASSWORD GATEWAY_API_KEY GATEWAY_BOOTSTRAP_ADMIN_PASSWORD
unset GATEWAY_IDENTITY_TOKEN_SECRET GATEWAY_PUBLIC_BASE_URL OCEANS_API_KEY_SECRET_ENCRYPTION_KEY
unset OCEANS_API_PERSONAL_KEY OCEANS_MCP_DISCOVERY_EXA OCEANS_MCP_DISCOVERY_REUI
unset OPENAI_API_KEY OPENROUTER_API_KEY REUI_LICENSE_KEY
exec fnox --non-interactive exec --redact \
  --only OCEANS_API_KEY_SECRET_ENCRYPTION_KEY \
  --only GATEWAY_IDENTITY_TOKEN_SECRET \
  --only GATEWAY_BOOTSTRAP_ADMIN_PASSWORD \
  --only GATEWAY_API_KEY \
  --only GATEWAY_PUBLIC_BASE_URL \
  --only OPENROUTER_API_KEY \
  -- "$CARGO_TARGET_DIR/release/gateway" serve --bootstrap-admin=true
'''
port = 8080
ready_http = "http://127.0.0.1:8080/readyz"
depends = ["db"]
boot_start = true
retry = 3
proxy = false

[env]
GATEWAY_CONFIG = "deploy/selfhost/gateway.yaml"
POSTGRES_URL = "{{ env.DATABASE_URL }}"
ADMIN_UI_UPSTREAM = "http://127.0.0.1:3001"
ADMIN_GATEWAY_ORIGIN = "http://127.0.0.1:8080"

[tasks.selfhost-gateway-build]
description = "Build the release gateway binary that the gateway daemon runs"
run = "cargo build --locked --release -p gateway"

[tasks.selfhost-config-validate]
description = "Resolve only the self-host secrets and validate the gateway configuration"
depends = ["selfhost-gateway-build"]
run = '''
unset EXA_API_KEY GATEWAY_ADMIN_PASSWORD GATEWAY_API_KEY GATEWAY_BOOTSTRAP_ADMIN_PASSWORD
unset GATEWAY_IDENTITY_TOKEN_SECRET GATEWAY_PUBLIC_BASE_URL OCEANS_API_KEY_SECRET_ENCRYPTION_KEY
unset OCEANS_API_PERSONAL_KEY OCEANS_MCP_DISCOVERY_EXA OCEANS_MCP_DISCOVERY_REUI
unset OPENAI_API_KEY OPENROUTER_API_KEY REUI_LICENSE_KEY
exec fnox --non-interactive exec --redact \
  --only OCEANS_API_KEY_SECRET_ENCRYPTION_KEY \
  --only GATEWAY_IDENTITY_TOKEN_SECRET \
  --only GATEWAY_BOOTSTRAP_ADMIN_PASSWORD \
  --only GATEWAY_API_KEY \
  --only GATEWAY_PUBLIC_BASE_URL \
  --only OPENROUTER_API_KEY \
  -- "$CARGO_TARGET_DIR/release/gateway" config validate
'''

[tasks.selfhost-backup]
description = "Dump the oceans database to .local/backups (starts `db` if needed); keeps 30 days"
run = '''
umask 077
mise daemons start db
mkdir -p .local/backups
pg_dump -Fc "$POSTGRES_URL" -f ".local/backups/oceans-$(date +%Y%m%dT%H%M%S).dump"
find .local/backups -name 'oceans-*.dump' -mtime +30 -delete
'''

[tasks.selfhost-apply]
description = "Build the checked-out revision, back up, validate config, and restart the stack"
depends = ["//crates/admin-ui/web:build", "selfhost-config-validate", "selfhost-backup"]
run = '''
mise daemons restart gateway admin-ui
curl -fsS --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/readyz
curl -fsS -o /dev/null http://127.0.0.1:8080/admin/login
mise run selfhost-expose
echo "deployed $(git describe --tags --always)"
'''

[tasks.selfhost-expose]
description = "Publish the gateway on the tailnet with `tailscale serve` (idempotent; tailnet-only, never funnel)"
run = '''
# Serve config persists inside tailscaled, so no daemon is needed. Re-running replaces the same handler.
tailscale serve --bg --https=443 --yes http://127.0.0.1:8080
tailscale serve status
'''

[tasks.deploy]
description = "Check out a ref (default: latest v* tag) and apply it on a self-hosted machine"
usage = 'arg "[ref]" help="Tag or commit to deploy; defaults to the latest v* tag on origin"'
run = '''
set -o pipefail
if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
  echo "working tree has tracked changes; refusing to deploy" >&2
  exit 1
fi
git fetch --tags --force origin
# Pick the default from tags that exist on origin now; local tags deleted upstream stay behind.
latest_tag="$(git ls-remote --tags --refs origin 'v*' | awk '{sub("refs/tags/","",$2); print $2}' | sort -V | awk 'END{print}')"
ref="${usage_ref:-$latest_tag}"
[ -n "$ref" ] || { echo "no v* tag on origin and no ref given" >&2; exit 1; }
# A branch name must resolve to the freshly fetched remote ref, not a stale local branch.
if git show-ref --verify --quiet "refs/remotes/origin/$ref"; then
  ref="origin/$ref"
fi
git checkout --detach "$ref"
# New process so the checked-out revision's mise config and tasks are loaded.
exec mise run selfhost-apply
'''
