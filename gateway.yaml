server:
  bind: "0.0.0.0:8080"
  log_format: "pretty"

database:
  path: "./gateway.db"

auth:
  bootstrap_admin:
    enabled: true
    email: admin@local
    password: literal.admin
    require_password_change: false

permissions:
  users:
    pages:
      - api_keys
      - models
      - usage_costs
      - leaderboard
      - agent_harnesses
      - request_logs
      - mcp_invocations
      - teams
      - users
      - service_accounts
    actions:
      - create_api_key
      - update_api_key
      - revoke_api_key
    default_page: usage_costs
  team_admins:
    pages:
      - spend_controls
    actions:
      - reveal_api_key
    default_page: usage_costs
  platform_admins:
    pages:
      - mcp
      - review_agent
      - spend_controls
      - rate_limits
      - agent_sessions
    actions: []
    default_page: api_keys

guardrails:
  default:
    enabled: true
    mode: audit
    packs:
      - core.shell
      - core.git
      - core.filesystem
      - database.postgresql
      - secrets.aws_secrets
      - secrets.onepassword
      - cloud.aws
      - cloud.gcp
      - kubernetes.kubectl
      - kubernetes.helm
    managed_checks: []
    stream_buffer_bytes: 4194304
    stream_buffer_timeout_ms: 120000
    secret_redaction:
      enabled: true
      tiers: [provider_tokens, credentials]
      disabled_rules: []
  managed_checks: {}
  model_routes: {}
  mcp_servers: {}

mcp:
  # OAuth sign-in for MCP clients. The local mise tasks point the issuer at the
  # gateway port; see docs/mcp/mcp-client-setup.md#oauth-sign-in.
  client_oauth:
    enabled: true
    public_base_url: env.OCEANS_LOCAL_PUBLIC_BASE_URL

request_logging:
  payloads:
    capture_mode: redacted_payloads
    request_max_bytes: 131072
    response_max_bytes: 65536
    stream_max_events: 128
    redaction_paths: []

agent_analysis:
  enabled: true
  shadow_diagnostics_enabled: false
  calibrated_score_enabled: false
  calibration_approval_id: null
  team_admin_enabled: false
  report_retention_days: 90
  queue_retention_days: 7
  context_input_boundary_tokens: 220000
  context_reserved_output_tokens: 128000
  context_penalty_points_per_repeated_excess: 2
  metrics:
    tokens: true
    cache: true
    context: true
    tools: true
    skills: true
    reliability: true
    outcomes: true
    finish_reasons: true
  cache_profiles: []

teams:
  - id: platform
    name: Platform

  - id: research
    name: Research

  - id: applied-ai
    name: Applied AI

  - id: operations
    name: Operations

service_accounts:
  - id: local-ci-runner
    name: Local CI Runner
    team: platform
    budget:
      cadence: daily
      amount_usd: "25.0000"
      hard_limit: true
      timezone: UTC
    keys:
      - id: primary
        name: Local CI Runner Key
        auto_create: true
        allowed_models:
          - openai-fast
          - gpt-6-astra

  - id: local-eval-worker
    name: Local Eval Worker
    team: research
    budget:
      cadence: daily
      amount_usd: "15.0000"
      hard_limit: true
      timezone: UTC

