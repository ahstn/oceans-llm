providers:
  openai-prod:
    type: openai_compat
    base_url: https://api.openai.com/v1
    auth:
      token: env.OPENAI_API_KEY

  openai-secondary:
    type: openai_compat
    base_url: https://api.openai.com/v1
    auth:
      token: env.OPENAI_API_KEY_SECONDARY

  openrouter:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    auth:
      token: env.OPENROUTER_API_KEY

  github-copilot-user:
    type: github_copilot
    pricing_provider_id: openai
    auth:
      mode: github_user
    display:
      label: GitHub Copilot (user token)

  vertex-adc:
    type: gcp_vertex
    project_id: your-gcp-project
    auth:
      mode: adc

  vertex-claude:
    type: gcp_vertex
    project_id: your-gcp-project
    auth:
      mode: service_account
      credentials_path: /path/to/service-account.json

  bedrock-us-east-1:
    type: aws_bedrock
    region: us-east-1
    endpoint_kind: bedrock_runtime
    auth:
      mode: default_chain
    display:
      label: AWS Bedrock

  bedrock-mantle-us-east-1:
    type: aws_bedrock
    region: us-east-1
    endpoint_kind: bedrock_mantle
    auth:
      mode: default_chain
    display:
      label: AWS Bedrock Mantle

# Route ids default to the provider key, and capabilities default to what the provider and
# compatibility profile can serve. See docs/configuration/configuration-reference.md#model-config.
models:
  gpt-6-astra:
    description: GPT-6 Astra via OpenAI with weighted route selection; use Responses for tools
    routes:
      - provider: openai-prod
        upstream_model: gpt-6-astra
        weight: 9.0
      - provider: openai-secondary
        upstream_model: gpt-6-astra
        weight: 1.0

  openai-fast:
    description: Alias kept for backward compatibility
    alias_of: gpt-6-astra

  openai-fast-v2:
    description: Legacy local demo alias
    alias_of: gpt-6-astra

  copilot-gpt-5.6-luna:
    description: GPT-5.6 Luna through GitHub Copilot user-token authentication
    route:
      provider: github-copilot-user
      upstream_model: gpt-5.6-luna
      compatibility:
        github_copilot:
          supports_responses: true
          upstream_supports:
            streaming: true
            tool_calls: true
            vision: true
            structured_outputs: true

  deepseek-v4-pro:
    route:
      provider: openrouter
      upstream_model: deepseek/deepseek-v4-pro

  deepseek-v4.1-flash:
    description: Low-cost OpenRouter model for generic live request verification
    route:
      provider: openrouter
      upstream_model: deepseek/deepseek-v4.1-flash

  claude-haiku-5.5:
    description: Claude Haiku 5.5 through OpenRouter for Anthropic Messages verification
    route:
      provider: openrouter
      upstream_model: anthropic/claude-haiku-5.5

  deepseek-v4-flash-0731:
    description: Older pinned DeepSeek Flash; prefer deepseek-v4.1-flash
    route:
      provider: openrouter
      upstream_model: deepseek/deepseek-v4-flash-0731
      pricing_override:
        input_usd_per_million_tokens: "0.0300"
        output_usd_per_million_tokens: "0.1000"

  qwen-3.6-27b:
    route:
      provider: openrouter
      upstream_model: qwen/qwen3.6-27b

  jev:
    description: TypeSafe Jev decisions through OpenRouter alpha transport
    route:
      provider: openrouter
      upstream_model: typesafe/jev-1.13
      pricing_override:
        input_usd_per_million_tokens: "0.0420"
        output_usd_per_million_tokens: "0.0000"
      compatibility:
        openrouter:
          api: decisions

  claude-sonnet:
    description: Claude on Vertex
    route:
      provider: vertex-claude
      upstream_model: anthropic/claude-sonnet-4-6

  claude-opus-4-7:
    description: Claude Opus on Vertex
    route:
      provider: vertex-claude
      upstream_model: anthropic/claude-opus-4-7

  claude-opus:
    description: Legacy local demo alias
    alias_of: claude-opus-4-7

  claude-fable-5.1:
    description: Claude Fable 5.1 on Vertex
    max_reasoning_effort: high
    route:
      provider: vertex-claude
      upstream_model: anthropic/claude-fable-5-1

  claude-sonnet-4.6:
    description: Claude Sonnet on AWS Bedrock
    route:
      provider: bedrock-us-east-1
      upstream_model: us.anthropic.claude-sonnet-4-6
      compatibility:
        aws_bedrock:
          api_style: runtime_anthropic_invoke
    allowlist:
      users:
        - ben@platform.local
        - diego@research.local

  bedrock-claude-sonnet:
    description: Legacy local demo alias
    alias_of: claude-sonnet-4.6

  gpt-oss-120b:
    description: OpenAI OSS on AWS Bedrock
    route:
      provider: bedrock-us-east-1
      upstream_model: gpt-oss-120b
      compatibility:
        aws_bedrock:
          api_style: runtime_openai_chat

  gpt-oss-120b-bedrock:
    description: Low-cost OpenAI GPT OSS 120B on AWS Bedrock Mantle
    route:
      provider: bedrock-mantle-us-east-1
      upstream_model: openai.gpt-oss-120b
      capabilities:
        vision: false
        json_schema: false
      compatibility:
        aws_bedrock:
          api_style: mantle_openai_responses

  gemini-pro-preview:
    description: Gemini preview on Vertex
    route:
      provider: vertex-adc
      upstream_model: google/gemini-3.1-pro-preview

  gemini-fast:
    description: Legacy local demo alias
    alias_of: gemini-pro-preview
