#:schema https://www.schemastore.org/cargo.json

[workspace]
members = [
  "crates/agent-session-analysis",
  "crates/admin-ui",
  "crates/gateway-client-config",
  "crates/gateway-client-ip",
  "crates/gateway-guardrails",
  "crates/gateway",
  "crates/gateway-core",
  "crates/gateway-mcp",
  "crates/gateway-providers",
  "crates/gateway-service",
  "crates/gateway-skills",
  "crates/gateway-store",
  "crates/oceans-cli",
]
resolver = "2"

[workspace.dependencies]
agent-session-analysis = { path = "crates/agent-session-analysis" }
admin-ui = { path = "crates/admin-ui" }
gateway-core = { path = "crates/gateway-core" }
gateway-guardrails = { path = "crates/gateway-guardrails" }
gateway-client-config = { path = "crates/gateway-client-config" }
gateway-client-ip = { path = "crates/gateway-client-ip" }
gateway-mcp = { path = "crates/gateway-mcp" }
gateway-providers = { path = "crates/gateway-providers" }
gateway-service = { path = "crates/gateway-service" }
gateway-skills = { path = "crates/gateway-skills" }
gateway-store = { path = "crates/gateway-store" }
anyhow = "1"
aes-gcm = "0.10"
aho-corasick = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-s3 = { version = "1.149", default-features = false, features = [
  "rt-tokio",
  "rustls",
  "default-https-client",
] }
aws-sigv4 = { version = "1.4", features = ["sign-http", "http1"] }
aws-smithy-runtime-api = "1.12"
base64 = "0.23"
bytes = "1"
caseless = "0.2.2"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
cron = "0.15"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
ipnet = "2.12"
itertools = "0.14"
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "pool",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls-tls",
] }
libsql = "0.9"
openidconnect = "4.0.1"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-http = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "trace"] }
httpdate = "1"
percent-encoding = "2"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "multipart",
  "query",
  "rustls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio-rustls",
] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "5", features = ["axum_extras", "time", "uuid"] }
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Workspace crates keep line tables, so panics and backtraces show file:line.
# Dependencies carry no debug info, which keeps link time and disk use down.
# `CARGO_PROFILE_DEV_DEBUG=full` gives workspace crates full debug info. Incremental
# builds stay on for edit loops; CI turns them off with `CARGO_INCREMENTAL=0`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# cargo-dist builds only the CLI package with this shipping profile.
[profile.dist]
inherits = "release"
lto = "thin"
