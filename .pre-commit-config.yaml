# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^(\./)?deploy/helm/.*/templates/'
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: strip-ai-coauthors
        name: strip AI co-author trailers
        language: system
        entry: scripts/strip-ai-coauthors.sh
        stages: [commit-msg]
      - id: lint
        name: lint
        language: system
        entry: mise run lint
        pass_filenames: false
        files:
          glob:
            - "crates/**/src/**/*.rs"
            - "crates/admin-ui/web/src/**/*.ts"
            - "crates/admin-ui/web/src/**/*.tsx"
      # The checks below also run inside `lint`; these hooks cover commits that
      # touch no Rust or TypeScript sources.
      # Checks only the staged files; CI runs the full `mise run typos` scan.
      - id: typos
        name: typos
        language: system
        entry: mise exec -- typos --force-exclude
        types: [text]
      - id: gitleaks
        name: gitleaks
        language: system
        entry: mise run secrets-check-staged
        pass_filenames: false
      - id: toml-check
        name: toml-check
        language: system
        entry: mise run toml-check
        pass_filenames: false
        files:
          glob: ["**/*.toml"]
      - id: links-check
        name: links-check
        language: system
        entry: mise run links-check
        pass_filenames: false
        files:
          glob: ["**/*.md"]
      - id: actions-audit
        name: actions-audit
        language: system
        entry: mise run actions-audit
        pass_filenames: false
        files:
          glob:
            - ".github/**/*.yml"
            - "**/action.yml"
