# Postgres store tasks. From the repo root: `mise run //crates/gateway-store:<task>`.
# The `db` daemon is declared in the root mise.toml and exports DATABASE_URL.

[tasks.check]
description = "Compile gateway-store and gateway Postgres targets"
run = "cargo check -p gateway-store -p gateway --all-targets"

[tasks."postgres:start"]
description = "Start local Postgres (the root `db` daemon)"
run = "mise daemons start db"

[tasks."postgres:stop"]
description = "Stop local Postgres"
run = "mise daemons stop db"

[tasks."postgres:status"]
description = "Show local Postgres daemon status"
run = "mise daemons status db"

[tasks."postgres:logs"]
description = "Show local Postgres daemon logs"
run = "mise daemons logs db"

[tasks."postgres:reset"]
description = "Delete the local Postgres data directory and start a fresh database"
run = """
# Stop fails when the supervisor is already down, so check the reported pid instead.
mise daemons stop db || true
data_dir="$(mise daemons ls --json | node -e '
  const db = JSON.parse(require("fs").readFileSync(0, "utf8")).find((d) => d.name === "db");
  if (db?.pid != null || !db?.data_dir) process.exit(1);
  process.stdout.write(db.data_dir);
')" || { echo "db daemon is still running or has no data_dir; refusing to delete it" >&2; exit 1; }
rm -rf "$data_dir"
mise daemons start db
"""

[tasks."postgres:env"]
description = "Print env exports for local Postgres URLs"
run = '''printf 'export POSTGRES_URL="%s"\nexport TEST_POSTGRES_URL="%s"\n' "$DATABASE_URL" "$DATABASE_URL"'''

[tasks."test:postgres"]
description = "Run focused Postgres-backed gateway-store tests"
env = { TEST_POSTGRES_URL = { required = true } }
run = "cargo test -p gateway-store postgres_"

[tasks."smoke:postgres"]
description = "Migrate, seed, and boot the gateway against Postgres, then probe its health endpoints"
depends = ["//crates/gateway:build"]
env = { POSTGRES_URL = { required = true }, GATEWAY_CONFIG = "../../gateway.prod.yaml", OPENAI_API_KEY = "${OPENAI_API_KEY:-test-openai-key}", OPENAI_API_KEY_SECONDARY = "${OPENAI_API_KEY_SECONDARY:-test-openai-key-secondary}" }
run = """
gateway="$CARGO_TARGET_DIR/debug/gateway"
log="${TMPDIR:-/tmp}/gateway-postgres-smoke.log"

"$gateway" migrate --apply
"$gateway" seed-config
"$gateway" bootstrap-admin
"$gateway" serve --run-migrations false --bootstrap-admin false --seed-config false >"$log" 2>&1 &
pid=$!
# The gateway may already have exited; keep the original status and show its log on failure.
trap 'status=$?; kill "$pid" 2>/dev/null || true; [ "$status" -eq 0 ] || cat "$log" >&2; exit "$status"' EXIT

curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/readyz >/dev/null
curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/dev/null
"""
