# Gateway operator tasks. From the repo root: `mise run //crates/gateway:<task>`.
# Each task mirrors a `gateway` subcommand. `prod:*` tasks use gateway.prod.yaml and need POSTGRES_URL.

[task_config]
# gateway.yaml, gateway.db, .local/, and the vendored data paths are all relative to the repo root.
dir = "{{config_root}}/../.."

[tasks.build]
description = "Build the gateway binary"
run = "cargo build -p gateway --bin gateway"

[tasks.serve]
description = "Run `gateway serve` against gateway.yaml"
extends = "gateway-local"
run = 'OCEANS_PROVIDER_CREDENTIAL_ENCRYPTION_KEY="${OCEANS_PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-$(scripts/local-provider-credential-key.sh)}" cargo run -p gateway --bin gateway -- serve'

[tasks.migrate]
description = "Run `gateway migrate --apply` against gateway.yaml"
extends = "gateway-local"
run = "cargo run -p gateway --bin gateway -- migrate --apply"

[tasks.bootstrap-admin]
description = "Run `gateway bootstrap-admin` against gateway.yaml"
extends = "gateway-local"
run = "cargo run -p gateway --bin gateway -- bootstrap-admin"

[tasks.seed-config]
description = "Run `gateway seed-config` against gateway.yaml"
extends = "gateway-local"
run = "cargo run -p gateway --bin gateway -- seed-config"

[tasks.seed-local-demo]
description = "Seed the local-only demo dataset (identity, budgets, API keys, request history, and agent session diagnostics)"
extends = "gateway-local"
# Pin gateway.yaml so a selfhost GATEWAY_CONFIG can never receive demo data.
run = "cargo run -p gateway --bin gateway -- --config gateway.yaml seed-local-demo"

[tasks.reset-local-demo]
description = "Recreate gateway.db with the local-only demo dataset"
extends = "gateway-local"
run = [
  "rm -f gateway.db",
  "cargo run -p gateway --bin gateway -- --config gateway.yaml seed-local-demo",
]

[tasks.purge-request-logs]
description = "Purge request logs older than the retention window from gateway.yaml's database"
extends = "gateway-local"
usage = '''
flag "--retention <window>" env="RETENTION" default="7d" help="1d, 3d, or 7d"
flag "--dry-run" help="Report what would be purged without deleting"
'''
run = 'cargo run -p gateway --bin gateway -- purge-request-logs --retention "$usage_retention" ${usage_dry_run:+--dry-run}'

[tasks.recompute-agent-analysis]
description = "Queue retained agent sessions for analysis against gateway.yaml"
extends = "gateway-local"
usage = 'flag "--limit <count>" env="LIMIT" default="100" help="Sessions per run, 1 through 1000"'
run = 'cargo run -p gateway --bin gateway -- recompute-agent-analysis --limit "$usage_limit"'

[tasks.sync-pricing-catalog]
description = "Refresh the vendored pricing catalog fallback snapshot"
run = "cargo run -p gateway --bin sync_pricing_catalog"

[tasks.sync-model-benchmarks]
description = "Upsert vendored Artificial Analysis scores from OpenRouter's top 200 models, excluding :variant IDs"
run = "cargo run -p gateway --bin sync_model_benchmarks"

[tasks."prod:serve"]
description = "Run `gateway serve` against gateway.prod.yaml"
extends = "gateway-prod"
run = "cargo run -p gateway --bin gateway -- serve"

[tasks."prod:migrate"]
description = "Run `gateway migrate --apply` against gateway.prod.yaml"
extends = "gateway-prod"
run = "cargo run -p gateway --bin gateway -- migrate --apply"

[tasks."prod:bootstrap-admin"]
description = "Run `gateway bootstrap-admin` against gateway.prod.yaml"
extends = "gateway-prod"
run = "cargo run -p gateway --bin gateway -- bootstrap-admin"

[tasks."prod:seed-config"]
description = "Run `gateway seed-config` against gateway.prod.yaml"
extends = "gateway-prod"
run = "cargo run -p gateway --bin gateway -- seed-config"

[tasks."prod:purge-request-logs"]
description = "Purge request logs older than the retention window from gateway.prod.yaml's database"
extends = "gateway-prod"
usage = '''
flag "--retention <window>" env="RETENTION" default="7d" help="1d, 3d, or 7d"
flag "--dry-run" help="Report what would be purged without deleting"
'''
run = 'cargo run -p gateway --bin gateway -- purge-request-logs --retention "$usage_retention" ${usage_dry_run:+--dry-run}'

[tasks."prod:recompute-agent-analysis"]
description = "Queue retained agent sessions for analysis against gateway.prod.yaml"
extends = "gateway-prod"
usage = 'flag "--limit <count>" env="LIMIT" default="100" help="Sessions per run, 1 through 1000"'
run = 'cargo run -p gateway --bin gateway -- recompute-agent-analysis --limit "$usage_limit"'
