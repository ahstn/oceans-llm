name: Oceans LLM Review Agent
description: Run the Oceans LLM review agent on same-repository pull requests.
inputs:
  review-workspace:
    description: Absolute path of the PR checkout to inspect as data, separate from the trusted action checkout.
    required: false
  oceans-url:
    description: Base URL for the Oceans LLM gateway.
    required: true
  oceans-api-key:
    description: Service account API key bound to this repository in Oceans.
    required: true
  model-id:
    description: Optional model key override.
    required: false
  model-mode:
    description: Optional execution mode override, either oceans or direct.
    required: false
  provider-key:
    description: Optional direct-provider credential key configured in Oceans.
    required: false
  inline-review:
    description: Enable inline PR review comments.
    required: false
  pr-summary:
    description: Enable a managed top-level PR summary comment.
    required: false
  diagrams:
    description: Enable diagram generation.
    required: false
  linked-issue-detection:
    description: Enable linked issue detection.
    required: false
  linked-issue-assessment:
    description: Enable linked issue assessment.
    required: false
  timeout-minutes:
    description: Maximum Pi execution time in minutes.
    required: false
    default: "20"
  max-inline-comments:
    description: Maximum number of inline review comments to publish.
    required: false
  request-changes-on-high-severity:
    description: Request changes when high-severity findings are present.
    required: false
  dry-run:
    description: Run without publishing GitHub comments or reviews.
    required: false
    default: "false"
  debug:
    description: Enable extra diagnostic logging without secrets or raw review text.
    required: false
    default: "false"
  github-token:
    description: GitHub token for PR access and publishing. Defaults to GITHUB_TOKEN.
    required: false
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile

    - name: Install review worker sandbox
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bash scripts/setup-sandbox.sh

    - name: Run Oceans LLM review agent
      shell: bash
      env:
        OCEANS_REVIEW_WORKSPACE: ${{ inputs.review-workspace || github.workspace }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        INPUT_OCEANS-URL: ${{ inputs.oceans-url }}
        INPUT_OCEANS-API-KEY: ${{ inputs.oceans-api-key }}
        INPUT_MODEL-ID: ${{ inputs.model-id }}
        INPUT_MODEL-MODE: ${{ inputs.model-mode }}
        INPUT_PROVIDER-KEY: ${{ inputs.provider-key }}
        INPUT_INLINE-REVIEW: ${{ inputs.inline-review }}
        INPUT_PR-SUMMARY: ${{ inputs.pr-summary }}
        INPUT_DIAGRAMS: ${{ inputs.diagrams }}
        INPUT_LINKED-ISSUE-DETECTION: ${{ inputs.linked-issue-detection }}
        INPUT_LINKED-ISSUE-ASSESSMENT: ${{ inputs.linked-issue-assessment }}
        INPUT_TIMEOUT-MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_MAX-INLINE-COMMENTS: ${{ inputs.max-inline-comments }}
        INPUT_REQUEST-CHANGES-ON-HIGH-SEVERITY: ${{ inputs.request-changes-on-high-severity }}
        INPUT_DRY-RUN: ${{ inputs.dry-run }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token || github.token }}
      working-directory: ${{ github.action_path }}
      run: node --import tsx src/main.ts
