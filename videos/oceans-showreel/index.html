<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: oklch(0.145 0.012 238);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: oklch(0.145 0.012 238);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-kbh8" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <!-- Frame 1 — Converge: agents and providers wire into one gateway; push into the tile. -->
      <div data-hf-id="hf-nsmo" id="f1-converge" class="clip" data-composition-id="f1-converge" data-composition-src="compositions/frames/f1-converge.html" data-start="0" data-duration="2.8" data-track-index="0" data-width="1920" data-height="1080"></div>
      <!-- Frame 2 — Flight: a 3D camera lands on four admin screens; one proof per landing. -->
      <div data-hf-id="hf-tmyx" id="f2-flight" class="clip" data-composition-id="f2-flight" data-composition-src="compositions/frames/f2-flight.html" data-start="2.8" data-duration="8.4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Frame 3 — Lockup: the console wall assembles, then the Oceans LLM lockup and CTA. -->
      <div data-hf-id="hf-a7gs" id="f3-lockup" class="clip" data-composition-id="f3-lockup" data-composition-src="compositions/frames/f3-lockup.html" data-start="11.2" data-duration="3.8" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- Score: original, synthesized by scripts/score.mjs and cut to the frame cues (-15 LUFS, -2 dBFS peak). -->
      <audio id="score" class="clip" src="assets/audio/score.wav" data-start="0" data-duration="15" data-track-index="3" data-volume="1"></audio>

      <!-- Sound effects (Pixabay library, assets/sfx), one fader. Starts subtract each file's measured lead-in. -->
      <hf-audio-group id="sfx" data-label="Sound effects" data-volume="1"></hf-audio-group>
      <!-- Exit push: the cinematic whoosh peaks on the cut to the lockup (11.2s). -->
      <audio id="sfx-exit" class="clip" data-audio-group="sfx" src="assets/sfx/whoosh-cinematic.mp3" data-start="10.26" data-media-start="1.6" data-duration="1.34" data-track-index="4" data-volume="0.5" data-fade-in="0.05" data-fade-out="0.35"></audio>
      <!-- Camera moves: whip burst (4.87s), swoop midpoint (6.9s), dive (8.8s), "every" flies up (13.0s).
           whoosh-tamed.wav is whoosh.mp3 with its noise crests held to -5 dBFS, so the whooshes stay loud
           without tripping the renderer's -1 dBTP trim, which would lower the whole mix:
           ffmpeg -i assets/sfx/whoosh.mp3 -af "aresample=48000,alimiter=limit=0.5623:attack=1:release=5:level=0:latency=1" -acodec pcm_s16le assets/sfx/whoosh-tamed.wav -->
      <audio id="sfx-whip" class="clip" data-audio-group="sfx" src="assets/sfx/whoosh-tamed.wav" data-start="4.71" data-duration="0.57" data-track-index="5" data-volume="0.95"></audio>
      <audio id="sfx-swoop" class="clip" data-audio-group="sfx" src="assets/sfx/whoosh-tamed.wav" data-start="6.74" data-duration="0.57" data-track-index="5" data-volume="1"></audio>
      <audio id="sfx-dive" class="clip" data-audio-group="sfx" src="assets/sfx/whoosh-tamed.wav" data-start="8.64" data-duration="0.57" data-track-index="5" data-volume="0.9"></audio>
      <audio id="sfx-every" class="clip" data-audio-group="sfx" src="assets/sfx/whoosh-tamed.wav" data-start="12.84" data-duration="0.57" data-track-index="5" data-volume="0.85"></audio>
      <!-- Rail ticks: the verb and noun roll over on each landing. -->
      <audio id="sfx-tick-cap" class="clip" data-audio-group="sfx" src="assets/sfx/click.mp3" data-start="4.755" data-duration="0.36" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-tick-redact" class="clip" data-audio-group="sfx" src="assets/sfx/click.mp3" data-start="6.705" data-duration="0.36" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-tick-govern" class="clip" data-audio-group="sfx" src="assets/sfx/click.mp3" data-start="8.805" data-duration="0.36" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-tick-see" class="clip" data-audio-group="sfx" src="assets/sfx/click.mp3" data-start="11.275" data-duration="0.36" data-track-index="6" data-volume="0.45"></audio>
      <!-- Pops: the MCP card lifts (9.16s); the URL and licence pills land (13.58s, 13.66s). -->
      <audio id="sfx-pop-card" class="clip" data-audio-group="sfx" src="assets/sfx/pop.mp3" data-start="9.05" data-duration="0.72" data-track-index="7" data-volume="0.6"></audio>
      <audio id="sfx-pop-url" class="clip" data-audio-group="sfx" src="assets/sfx/pop.mp3" data-start="13.47" data-duration="0.72" data-track-index="7" data-volume="0.55"></audio>
      <!-- The fake key glyph-scrambles into [REDACTED] (7.52s on). -->
      <audio id="sfx-scramble" class="clip" data-audio-group="sfx" src="assets/sfx/glitch-3.mp3" data-start="7.24" data-duration="0.7" data-track-index="8" data-volume="0.6" data-fade-out="0.12"></audio>
      <audio id="sfx-pop-license" class="clip" data-audio-group="sfx" src="assets/sfx/pop.mp3" data-start="13.55" data-duration="0.72" data-track-index="8" data-volume="0.45"></audio>
      <!-- The sheen crosses the URL (14.2s). -->
      <audio id="sfx-sheen" class="clip" data-audio-group="sfx" src="assets/sfx/sparkle.mp3" data-start="14.18" data-duration="0.82" data-track-index="9" data-volume="0.18" data-fade-out="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 15);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
