# $schema=https://www.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: cargo
    open-pull-requests-limit: 10
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      async-runtime:
        patterns:
          - 'async-stream'
          - 'async-trait'
          - 'bytes'
          - 'futures-*'
          - 'tokio'
      aws-sdk:
        patterns:
          - 'aws-*'
      auth-and-crypto:
        patterns:
          - 'aes-gcm'
          - 'argon2'
          - 'jsonwebtoken'
          - 'openidconnect'
          - 'sha2'
      observability:
        patterns:
          - 'opentelemetry*'
          - 'tracing*'
      serialization-and-config:
        patterns:
          - 'serde*'
          - 'toml'
      storage:
        patterns:
          - 'libsql'
          - 'sqlx'
      testing:
        patterns:
          - 'serial_test'
          - 'tempfile'
      web-api:
        patterns:
          - 'axum'
          - 'http'
          - 'http-body'
          - 'reqwest'
          - 'tower'
          - 'tower-http'
          - 'utoipa'
      utilities:
        patterns:
          - 'anyhow'
          - 'base64'
          - 'chrono'
          - 'clap'
          - 'cron'
          - 'itertools'
          - 'lettre'
          - 'percent-encoding'
          - 'rand'
          - 'thiserror'
          - 'time'
          - 'url'
          - 'uuid'

  - package-ecosystem: bun
    # A zero version-update limit leaves security updates enabled.
    open-pull-requests-limit: 5
    # tests/harness-integration/ is intentionally omitted.
    directories:
      - docs/
      - crates/admin-ui/web/
    schedule:
      interval: cron
      cronjob: '0 8 * * 1,3'
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - 'vitest*'
          - '@playwright/*'
          - '@testing-library/*'
          - 'knip*'
          - 'husky*'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'
          - 'eslint*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
      tanstack:
        patterns:
          - '@tanstack/*'
      ui-components-and-assets:
        patterns:
          - '@fontsource-variable/*'
          - '@hugeicons/*'
          - '@lobehub/icons-*'
          - '@radix-ui/*'
          - 'boring-avatars'
          - 'cmdk'
          - 'radix-ui'
          - 'recharts'
          - 'shadcn'
          - 'sonner'
      styling:
        patterns:
          - '@tailwindcss/*'
          - 'autoprefixer'
          - 'class-variance-authority'
          - 'clsx'
          - 'postcss'
          - 'tailwind*'
          - 'tw-animate-css'
      content-and-formatting:
        patterns:
          - 'date-fns'
          - 'react-markdown'
          - 'shiki'
      api-client:
        patterns:
          - 'openapi-*'
      build-tools:
        patterns:
          - '@types/node'
          - '@vitejs/*'
          - 'typescript'
          - 'vite'
          - 'vite-*'
      testing:
        patterns:
          - '@playwright/*'
          - '@testing-library/*'
          - 'jsdom'
          - 'playwright'
          - 'vitest*'
      code-quality:
        patterns:
          - '@shadcn/lint'
          - 'oxfmt*'
          - 'oxlint*'

  # The review agent pins exact versions. Pi and its extensions release
  # together and share peer dependencies, so they update as one PR.
  - package-ecosystem: bun
    open-pull-requests-limit: 3
    directory: /actions/review-agent
    schedule:
      interval: cron
      cronjob: '0 8 * * 1,3'
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      pi:
        patterns:
          - '@earendil-works/pi-*'
          - 'pi-*'
          - 'typebox'
      review-agent-tooling:
        patterns:
          - '*'

  - package-ecosystem: docker
    open-pull-requests-limit: 2
    directories:
      - /crates/gateway
      - /crates/admin-ui/web
    schedule:
      interval: cron
      cronjob: '0 8 * * 1,3'
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 3
    # Composite actions outside .github/workflows must be listed explicitly.
    directories:
      - "/"
      - "/.github/actions/*"
      - "/actions/review-agent"
    # cargo-dist generates release.yml from the pins in dist-workspace.toml,
    # and `dist plan` fails when the two differ. Update those pins and run
    # `mise run dist-generate` instead.
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      github-maintained-actions:
        patterns:
          - "actions/*"
