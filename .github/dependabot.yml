# $schema=https://www.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: cargo
    open-pull-requests-limit: 10
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      async-runtime:
        patterns:
          - 'async-stream'
          - 'async-trait'
          - 'bytes'
          - 'futures-*'
          - 'tokio'
      aws-sdk:
        patterns:
          - 'aws-*'
      auth-and-crypto:
        patterns:
          - 'aes-gcm'
          - 'argon2'
          - 'jsonwebtoken'
          - 'openidconnect'
          - 'sha2'
      observability:
        patterns:
          - 'opentelemetry*'
          - 'tracing*'
      serialization-and-config:
        patterns:
          - 'serde*'
          - 'toml'
      storage:
        patterns:
          - 'libsql'
          - 'sqlx'
      testing:
        patterns:
          - 'serial_test'
          - 'tempfile'
      web-api:
        patterns:
          - 'axum'
          - 'http'
          - 'http-body'
          - 'reqwest'
          - 'tower'
          - 'tower-http'
          - 'utoipa'
      utilities:
        patterns:
          - 'anyhow'
          - 'base64'
          - 'chrono'
          - 'clap'
          - 'cron'
          - 'itertools'
          - 'lettre'
          - 'percent-encoding'
          - 'rand'
          - 'thiserror'
          - 'time'
          - 'url'
          - 'uuid'

  - package-ecosystem: bun
    # A zero version-update limit leaves security updates enabled.
    open-pull-requests-limit: 0
    # tests/harness-integration/ is intentionally omitted.
    directories:
      - docs/
      - crates/admin-ui/web/
    schedule:
      interval: cron
      cronjob: '0 8 * * 1,3'
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - 'vitest*'
          - '@playwright/*'
          - '@testing-library/*'
          - 'knip*'
          - 'husky*'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'
          - 'eslint*'

  - package-ecosystem: docker
    open-pull-requests-limit: 1
    directories:
      - /crates/gateway
      - /crates/admin-ui/web
    schedule:
      interval: cron
      cronjob: '0 8 * * 1,3'

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 3
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      github-maintained-actions:
        patterns:
          - "actions/*"
