# $schema=https://www.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: cargo
    open-pull-requests-limit: 10
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: bun
    open-pull-requests-limit: 10
    directories:
      - docs/
      - crates/admin-ui/web/
    schedule:
      interval: cron
      cronjob: '0 8 * * 1,3'
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - 'vitest*'
          - '@playwright/*'
          - '@testing-library/*'
          - 'knip*'
          - 'husky*'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'
          - 'eslint*'

  - package-ecosystem: docker
    open-pull-requests-limit: 1
    directories:
      - /
    schedule:
      interval: cron
      cronjob: '0 8 * * 1,3'

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
