name: OpenCode Oceans plugin

on:
  pull_request:
    paths:
      - "packages/opencode-oceans/**"
      - "actions/.oxlintrc.json"
      - "actions/.oxfmtrc.json"
      - ".github/workflows/opencode-oceans.yml"
      - "mise.toml"
      - "mise.lock"
  push:
    branches: ["main"]
    paths:
      - "packages/opencode-oceans/**"
      - "actions/.oxlintrc.json"
      - "actions/.oxfmtrc.json"
      - ".github/workflows/opencode-oceans.yml"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stage an existing release tag (opencode-oceans-vX.Y.Z); dispatch from main"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      file: ${{ steps.package.outputs.file }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout package revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require a release commit on main
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$DISPATCH_COMMIT"

      - name: Setup mise and Bun
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: bun

      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mise exec -- bun -e '
            const pkg = await Bun.file("packages/opencode-oceans/package.json").json();
            const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (!stable.test(pkg.version) ||
                pkg.name !== "@ahstn/opencode-oceans" ||
                pkg.publishConfig?.registry !== "https://registry.npmjs.org" ||
                pkg.publishConfig?.access !== "public") {
              throw new Error("Package version, name, registry, or access does not match");
            }
            if (process.env.RELEASE_EVENT === "workflow_dispatch" &&
                process.env.RELEASE_TAG !== "opencode-oceans-v" + pkg.version) {
              throw new Error("Release tag does not match package version");
            }
          '
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check package with frozen dependencies
        run: mise run //opencode:check

      - name: Pack checked source package
        id: package
        working-directory: packages/opencode-oceans
        run: |
          set -euo pipefail
          mise exec -- bun run pack
          version=$(mise exec -- bun -p 'require("./package.json").version')
          file="ahstn-opencode-oceans-${version}.tgz"
          digest=$(sha256sum "dist/$file")
          printf '%s\n' "$digest" | tee dist/SHA256SUMS
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"

      - name: Upload checked source package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-oceans-source
          path: |
            packages/opencode-oceans/dist/${{ steps.package.outputs.file }}
            packages/opencode-oceans/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  stage:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ahstn/oceans-llm'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-opencode
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout checked release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Setup mise and Node
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node

      - name: Download checked source package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencode-oceans-source
          path: packages/opencode-oceans/dist

      - name: Verify and stage checked package on npm
        working-directory: packages/opencode-oceans
        env:
          PACKAGE_FILE: ${{ needs.check.outputs.file }}
          PACKAGE_SHA256: ${{ needs.check.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l)" -eq 2
          printf '%s  %s\n' "$PACKAGE_SHA256" "dist/$PACKAGE_FILE" | sha256sum --check --strict
          mise exec -- npm stage publish "./dist/$PACKAGE_FILE" \
            --registry=https://registry.npmjs.org --access public --tag latest --ignore-scripts
