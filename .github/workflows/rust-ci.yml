name: rust-ci

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: true

jobs:
  rust-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oceans_llm_ci
          POSTGRES_USER: oceans
          POSTGRES_PASSWORD: oceans
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oceans -d oceans_llm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup mise and Rust
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: rust

      - name: Check Rust formatting
        run: mise run rust-fmt-check

      - name: Lint Rust workspace
        run: mise run rust-lint

      - name: Run gateway-store Postgres check
        run: mise //crates/gateway-store:check

      - name: Test Rust workspace
        run: mise run rust-test

      - name: Run gateway-store Postgres tests
        env:
          TEST_POSTGRES_URL: postgres://oceans:oceans@localhost:5432/oceans_llm_ci
        run: mise //crates/gateway-store:test:postgres

      - name: Run gateway Postgres smoke checks
        env:
          POSTGRES_URL: postgres://oceans:oceans@localhost:5432/oceans_llm_ci
        run: mise //crates/gateway-store:smoke:postgres
