name: rust-ci

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: true
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  POSTGRES_CONNECTION: postgres://oceans:oceans@localhost:5432/oceans_llm_ci

jobs:
  rust-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oceans_llm_ci
          POSTGRES_USER: oceans
          POSTGRES_PASSWORD: oceans
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oceans -d oceans_llm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and Rust
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust

      - name: Check Rust formatting
        run: mise run rust-fmt-check

      - name: Lint Rust workspace
        run: mise run rust-lint

      - name: Run gateway-store Postgres check
        run: mise run //crates/gateway-store:check

      - name: Test Rust workspace
        run: mise run rust-test

      - name: Run gateway-store Postgres tests
        env:
          TEST_POSTGRES_URL: ${{ env.POSTGRES_CONNECTION }}
        run: mise run //crates/gateway-store:test:postgres

      - name: Run gateway Postgres smoke checks
        env:
          POSTGRES_URL: ${{ env.POSTGRES_CONNECTION }}
        run: mise run //crates/gateway-store:smoke:postgres
