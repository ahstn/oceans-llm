name: helm-ci

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-ci.yml"
      - "mise.toml"
      - "mise.lock"
  push:
    branches: ["main"]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-ci.yml"
      - "mise.toml"
      - "mise.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  helm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise, Helm, and kubeconform
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: helm kubeconform

      - name: Run Helm checks
        run: mise run //helm:check

      - name: Validate rendered manifests against Kubernetes schemas
        run: mise run //helm:validate
