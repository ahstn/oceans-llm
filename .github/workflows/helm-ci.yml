name: helm-ci

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-ci.yml"
      - "mise.toml"
      - "mise.lock"
  push:
    branches: ["main"]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-ci.yml"
      - "mise.toml"
      - "mise.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  helm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise, Helm, and kubeconform
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: helm kubeconform

      - name: Lint, render, and validate the chart
        run: mise run //helm:check
