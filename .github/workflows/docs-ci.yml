name: docs-ci

on:
  pull_request:
    paths:
      - "docs/**"
      - "crates/gateway/openapi/admin-api.json"
      - ".github/workflows/docs-ci.yml"
      - "mise.toml"
      - "mise.lock"
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise, Node.js and Bun
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node bun

      # Builds the site, then runs astro check and nimbus-docs check against it.
      # Deploys are manual: mise run //docs:deploy.
      - name: Build and check docs site
        run: mise run //docs:check
