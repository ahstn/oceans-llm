name: review-agent-self-hosted-smoke

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to smoke-test against.
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  review-agent-smoke:
    name: Self-hosted review-agent smoke
    runs-on: [self-hosted]
    timeout-minutes: 10

    steps:
      - name: Checkout action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/pull/${{ inputs.pr_number }}/head
          path: review-target
          fetch-depth: 0

      - name: Setup mise, Node.js, and Bun
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node bun

      - name: Install review agent action dependencies
        run: mise run review-agent-action-install

      - name: Run source action against a mock Oceans API
        working-directory: actions/review-agent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_WORKSPACE: ${{ github.workspace }}/review-target
        run: mise exec -- node --import tsx scripts/smoke-action.ts
