name: review-agent-ci

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: true
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  review-agent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise, Node.js and Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node bun

      - name: Install review worker sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Check review agent action
        # The tests use synthetic credentials and probe the real Linux sandbox.
        run: mise run review-agent-action-check
