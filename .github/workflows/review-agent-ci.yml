name: review-agent-ci

on:
  pull_request:
    paths:
      - "actions/**"
      - ".github/workflows/review-agent-ci.yml"
      - "mise.toml"
      - "mise.lock"
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  review-agent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise, Node.js and Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node bun

      - name: Install review worker sandbox
        run: mise exec -- bash actions/review-agent/scripts/setup-sandbox.sh

      - name: Check review agent action
        # The tests use synthetic credentials and probe the real Linux sandbox.
        run: mise run //review-agent:check
