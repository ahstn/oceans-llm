name: Check CLI release artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the built CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: target/distrib
      - name: Check the archived executable
        env:
          RELEASE_TARGET: ${{ matrix.targets[0] }}
          RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
        run: bash scripts/check-cli-release.sh
