name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/admin-ui/web/**"
      - ".github/workflows/react-doctor.yml"
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2
        with:
          version: "0.9.13"
          blocking: "warning"
          comment: false
          review-comments: true
          directory: crates/admin-ui/web
