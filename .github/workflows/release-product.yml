name: Publish product images and Helm chart

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  HELM_CHART_NAME: oceans-llm
  HELM_CHART_DIR: deploy/helm/oceans-llm
  HELM_OCI_REGISTRY: ghcr.io/ahstn/charts

jobs:
  # Each platform builds on a runner of its own architecture, so no build runs under QEMU.
  # Emulated arm64 builds of the admin UI hung in `vite build` and timed out the release.
  # Each build pushes its image by digest; merge-images then tags one multi-platform index.
  # This job holds the one list of release images and expands it into both matrices, so an image
  # cannot be built without also being merged and tagged.
  image-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Expand the image inventory
        id: matrix
        run: |
          set -euo pipefail
          inventory='[
            {"image": "oceans-llm-gateway", "title": "Oceans LLM Gateway",
             "description": "Oceans LLM gateway service", "dockerfile": "crates/gateway/Dockerfile",
             "timeout": 60, "arches": ["amd64"]},
            {"image": "oceans-llm-admin-ui", "title": "Oceans LLM Admin UI",
             "description": "Oceans LLM admin UI service", "dockerfile": "crates/admin-ui/web/Dockerfile",
             "timeout": 30, "arches": ["amd64", "arm64"]}
          ]'
          runners='{"amd64": "ubuntu-latest", "arm64": "ubuntu-24.04-arm"}'
          # An architecture with no runner label fails here rather than when GitHub schedules it.
          builds="$(jq -c --argjson runners "$runners" '[.[] | . as $image | .arches[]
            | ($runners[.] // error("no runner label for architecture \(.)")) as $runner
            | $image + {arch: ., platform: "linux/\(.)", runner: $runner} | del(.arches)]' <<< "$inventory")"
          images="$(jq -c '[.[] | {image, platforms: (.arches | join(" "))}]' <<< "$inventory")"
          {
            echo "builds=$builds"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  build-images:
    needs: image-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-matrix.outputs.builds) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Resolve tool versions
        id: versions
        run: |
          {
            echo "bun=$(mise tool bun --requested)"
            echo "rust=$(mise tool rust --requested)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ahstn/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ fromJSON(inputs.plan).announcement_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            BUN_VERSION=${{ steps.versions.outputs.bun }}
            RUST_VERSION=${{ steps.versions.outputs.rust }}
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/ahstn/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record the image digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # A rerun of this job replaces the digest from its earlier attempt; artifacts are otherwise
          # immutable. Seven days lets a partial rerun merge against digests from the first attempt.
          overwrite: true
          retention-days: 7

  merge-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [image-matrix, build-images]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-matrix.outputs.images) }}

    steps:
      - name: Download the platform image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ahstn/${{ matrix.image }}
          tags: |
            type=raw,value=${{ fromJSON(inputs.plan).announcement_tag }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ !fromJSON(inputs.plan).announcement_is_prerelease }}

      - name: Create and push the multi-platform image
        id: index
        env:
          IMAGE: ghcr.io/ahstn/${{ matrix.image }}
          PLATFORMS: ${{ matrix.platforms }}
          METADATA: ${{ steps.meta.outputs.json }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # A partial rerun can find only some digests, such as after artifacts expire. Refuse to
          # tag an index that is missing a platform.
          sources=()
          for arch in $PLATFORMS; do
            if [[ ! -s "$arch" ]]; then
              echo "::error::No $arch digest for $IMAGE; rerun all jobs to rebuild every platform"
              exit 1
            fi
            sources+=("$IMAGE@$(<"$arch")")
          done
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$METADATA")
          # Take the digest from the index bytes this run pushes, not from a tag that another
          # release of the same commit could overwrite. `--dry-run` prints exactly those bytes.
          index="$(docker buildx imagetools create --dry-run "${tags[@]}" "${sources[@]}")"
          digest="sha256:$(printf '%s' "$index" | sha256sum | cut -d' ' -f1)"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          # Fails if the registry does not hold an index with that digest.
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ahstn/${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  publish-helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: merge-images
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup mise, Helm, and kubeconform
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: helm kubeconform
          cache: false

      # A tag can point at a commit helm-ci never checked, so validate here too.
      - name: Lint and render the chart
        run: mise run //helm:check

      - name: Package and push Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
        run: |
          set -euo pipefail

          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          chart_version="${RELEASE_TAG#v}"
          mkdir -p dist/charts

          helm package "$HELM_CHART_DIR" \
            --version "$chart_version" \
            --app-version "$RELEASE_TAG" \
            --destination dist/charts

          helm push "dist/charts/${HELM_CHART_NAME}-${chart_version}.tgz" "oci://${HELM_OCI_REGISTRY}"
