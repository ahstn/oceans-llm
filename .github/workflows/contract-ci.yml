name: contract-ci

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: true
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  admin-contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise, Rust, and Bun
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: rust bun

      - name: Cache Cargo artifacts
        uses: ./.github/actions/rust-cache

      - name: Check generated admin contract
        run: mise run admin-contract-check
