name: oceans-review-agent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: oceans-review-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: true
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout PR as review data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .review-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Setup mise, Rust, Bun, and Node.js
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust bun node

      - name: Cache Cargo artifacts
        uses: ./.github/actions/rust-cache

      - name: Build temporary control plane and install action dependencies
        run: |
          mise exec -- cargo build -p gateway --bin gateway
          mise run review-agent-action-install

      - name: Start real Oceans control plane
        id: oceans
        working-directory: actions/review-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: mise exec -- node --import tsx scripts/ci-gateway.ts start

      - name: Review pull request with Pi and OpenRouter
        uses: ./actions/review-agent
        with:
          review-workspace: ${{ github.workspace }}/.review-source
          oceans-url: ${{ steps.oceans.outputs.url }}
          oceans-api-key: ${{ steps.oceans.outputs.api-key }}
          model-mode: oceans
          model-id: openai/gpt-5.6-luna
          github-token: ${{ github.token }}
          timeout-minutes: "15"
          max-inline-comments: "10"
          pr-summary: "true"
          inline-review: "true"
          request-changes-on-high-severity: "false"

      - name: Verify persisted review result
        if: always() && steps.oceans.outcome == 'success'
        working-directory: actions/review-agent
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: mise exec -- node --import tsx scripts/ci-gateway.ts verify

      - name: Stop temporary control plane
        if: always()
        working-directory: actions/review-agent
        run: mise exec -- node --import tsx scripts/ci-gateway.ts stop

      - name: Upload sanitized review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-agent-evidence
          path: ${{ runner.temp }}/oceans-review-gateway/evidence.json
          if-no-files-found: ignore
