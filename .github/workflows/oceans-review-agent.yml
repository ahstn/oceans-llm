name: oceans-review-agent

# Fork PRs are skipped below, so pull_request still receives the secrets and
# token permissions this job needs without pull_request_target.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: oceans-review-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # Fresh CI builds gain nothing from incremental state; it only grows the cache.
  CARGO_INCREMENTAL: "0"
  REVIEW_MODEL_ID: openai/gpt-5.6-luna

jobs:
  review:
    # Dependabot-triggered runs get a read-only token and no secrets, so they
    # can neither review nor publish the advisory check.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout PR as review data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .review-source
          fetch-depth: 0
          persist-credentials: false

      # A failed review is advisory: it does not mean the PR is broken or
      # unmergeable. Steps after checkout continue on error and are gated on
      # their predecessors; the final step reports a neutral "Oceans review"
      # check.

      # Validate the key before the Rust build so a revoked or deleted key fails
      # in seconds. OpenRouter answers 401 "User not found." for unknown keys.
      - name: Check OpenRouter credential
        id: credential
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::warning::OPENROUTER_API_KEY secret is not set"
            exit 1
          fi
          body="$(mktemp)"
          # curl reports 000 when the request fails or exceeds --max-time.
          status="$(curl --silent --show-error --max-time 30 --output "$body" --write-out '%{http_code}' \
            --config - https://openrouter.ai/api/v1/key \
            <<< "header = \"Authorization: Bearer ${OPENROUTER_API_KEY}\"")" || true
          if [[ "$status" == "000" ]]; then
            echo "::warning::Could not reach OpenRouter to check OPENROUTER_API_KEY"
            exit 1
          elif [[ "$status" != "200" ]]; then
            echo "::warning::OpenRouter rejected OPENROUTER_API_KEY (HTTP $status): $(jq -r '.error.message // "unknown error"' "$body")"
            exit 1
          fi
          jq -r '.data | "OpenRouter key accepted; limit_remaining=\(.limit_remaining // "unlimited")"' "$body"

      - name: Setup mise, Rust, Bun, and Node.js
        id: setup
        if: steps.credential.outcome == 'success'
        continue-on-error: true
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust bun node

      # The build works without a cache, so a cache failure is not reported.
      - name: Cache Cargo artifacts
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/rust-cache

      - name: Build temporary control plane and install action dependencies
        id: build
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          mise exec -- cargo build -p gateway --bin gateway
          mise run //review-agent:install

      - name: Start real Oceans control plane
        id: oceans
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: actions/review-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: mise exec -- node --import tsx scripts/ci-gateway.ts start

      - name: Review pull request with Pi and OpenRouter
        id: review
        if: steps.oceans.outcome == 'success'
        continue-on-error: true
        uses: ./actions/review-agent
        with:
          review-workspace: ${{ github.workspace }}/.review-source
          oceans-url: ${{ steps.oceans.outputs.url }}
          oceans-api-key: ${{ steps.oceans.outputs.api-key }}
          model-mode: oceans
          model-id: ${{ env.REVIEW_MODEL_ID }}
          github-token: ${{ github.token }}
          timeout-minutes: "15"
          max-inline-comments: "10"
          pr-summary: "true"
          inline-review: "true"
          request-changes-on-high-severity: "false"

      - name: Verify persisted review result
        id: verify
        if: ${{ !cancelled() && steps.oceans.outcome == 'success' }}
        continue-on-error: true
        working-directory: actions/review-agent
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: mise exec -- node --import tsx scripts/ci-gateway.ts verify

      - name: Stop temporary control plane
        if: always() && steps.oceans.outcome != 'skipped'
        continue-on-error: true
        working-directory: actions/review-agent
        run: mise exec -- node --import tsx scripts/ci-gateway.ts stop

      - name: Upload sanitized review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-agent-evidence
          path: ${{ runner.temp }}/oceans-review-gateway/evidence.json
          if-no-files-found: ignore
        continue-on-error: true

      - name: Report review status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Two PRs can share a head SHA; each owns the check tagged with its number.
          CHECK_EXTERNAL_ID: pull/${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: |
            credential check=${{ steps.credential.outcome }}
            setup=${{ steps.setup.outcome }}
            build=${{ steps.build.outcome }}
            control-plane start=${{ steps.oceans.outcome }}
            review=${{ steps.review.outcome }}
            result verification=${{ steps.verify.outcome }}
        run: |
          declare -A outcome
          failed=""
          while IFS='=' read -r step result; do
            [[ -n "$step" ]] || continue
            outcome[$step]="$result"
            [[ -n "$failed" || "$result" != failure ]] || failed="$step"
          done <<< "$OUTCOMES"
          # Anything short of a verified review is neutral, including failures
          # in steps that are not listed, such as checkout.
          if [[ "${outcome[review]}" == success && "${outcome[result verification]}" == success ]]; then
            conclusion=success title="Review completed" summary="Pi reviewed this pull request."
          else
            conclusion=neutral title="Review unavailable: ${failed:-a workflow step} failed"
            summary="The automated review did not complete. This does not block merging; see the [workflow run](${RUN_URL}) for details."
            echo "::warning::Oceans review skipped because ${failed:-a workflow step} failed"
          fi
          # Update this PR's check on reruns instead of adding duplicates.
          check_id="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Oceans%20review&filter=all" \
            --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and .external_id == \"${CHECK_EXTERNAL_ID}\")][0].id // empty")" || check_id=""
          if [[ -n "$check_id" ]]; then
            request=(--method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}")
          else
            request=(--method POST "repos/${GITHUB_REPOSITORY}/check-runs" -f head_sha="$HEAD_SHA")
          fi
          # Failing to publish the advisory check must not fail the job.
          gh api "${request[@]}" --silent -f name="Oceans review" -f external_id="$CHECK_EXTERNAL_ID" \
            -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
            -f "output[title]=$title" -f "output[summary]=$summary" \
            || echo "::warning::Could not publish the Oceans review check"
          echo "### ${title}" >> "$GITHUB_STEP_SUMMARY"
