name: ci

on:
  pull_request:
    # No status checks are required on main. If ci / check becomes required,
    # drop this filter or docs-only PRs will wait on a check that never runs.
    paths-ignore:
      - "docs/**"
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # Fresh CI builds gain nothing from incremental state; it only grows the cache.
  CARGO_INCREMENTAL: "0"
  POSTGRES_CONNECTION: postgres://oceans:oceans@localhost:5432/oceans_llm_ci

jobs:
  # One job shares a single Rust cache restore and compile across the Rust,
  # admin contract, and end-to-end checks. Cheap checks run first.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # Matches the Postgres version that mise.toml runs for local development.
        image: postgres:18-alpine
        env:
          POSTGRES_DB: oceans_llm_ci
          POSTGRES_USER: oceans
          POSTGRES_PASSWORD: oceans
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oceans -d oceans_llm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise, Rust, Bun, Node.js, and cargo-deny
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust bun node cargo-deny

      - name: Cache Cargo artifacts
        uses: ./.github/actions/rust-cache

      - name: Check Rust formatting
        run: mise run rust-fmt-check

      - name: Lint Rust workspace
        run: mise run rust-lint

      - name: Check Rust dependency advisories, licenses, and sources
        run: mise run rust-deny

      - name: Check generated admin contract
        run: mise run admin-contract-check

      - name: Test Rust workspace including Postgres
        env:
          TEST_POSTGRES_URL: ${{ env.POSTGRES_CONNECTION }}
        run: mise run rust-test

      - name: Run gateway Postgres smoke checks
        env:
          POSTGRES_URL: ${{ env.POSTGRES_CONNECTION }}
        run: mise run //crates/gateway-store:smoke:postgres

      - name: Run end-to-end contract tests
        run: mise run //ui:e2e

      - name: Upload Playwright report and test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            crates/admin-ui/web/playwright-report
            crates/admin-ui/web/test-results
          if-no-files-found: ignore
