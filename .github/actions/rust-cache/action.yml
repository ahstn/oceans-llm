name: Cache Cargo artifacts
description: Cache Cargo dependencies and both configured artifact directories after mise setup.

runs:
  using: composite
  steps:
    - name: Locate Cargo artifact directories
      id: directories
      shell: bash
      run: |
        metadata="$(mise exec -- cargo metadata --format-version 1 --no-deps)"
        build_dir="$(jq -r '.build_directory' <<< "$metadata")"
        target_dir="$(jq -r '.target_directory' <<< "$metadata")"
        echo "build=$(realpath -m --relative-to="$GITHUB_WORKSPACE" "$build_dir")" >> "$GITHUB_OUTPUT"
        echo "target=$(realpath -m --relative-to="$GITHUB_WORKSPACE" "$target_dir")" >> "$GITHUB_OUTPUT"

    - name: Restore Cargo cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cmd-format: mise exec -- {0}
        # Pull requests restore main's cache instead of each saving their own copy.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        workspaces: |
          . -> ${{ steps.directories.outputs.build }}
          . -> ${{ steps.directories.outputs.target }}
