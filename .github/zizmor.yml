# zizmor audits GitHub Actions workflows (`mise run actions-audit`).
#
# release.yml is generated by cargo-dist from dist-workspace.toml, and `dist plan`
# fails when it is edited by hand. Its current findings come from the cargo-dist
# template and are ignored by exact line and column. A finding that regeneration
# moves fails again until its entry is updated, and an unrelated finding would
# have to land on the same position to be hidden. The pull request job only runs
# `dist plan`; fork pull requests get a read-only token.
rules:
  excessive-permissions:
    ignore:
      - release.yml:18:3
  template-injection:
    ignore:
      - release.yml:80:91
      - release.yml:136:18
      - release.yml:146:15
      - release.yml:150:26
      - release.yml:150:98
      - release.yml:203:26
      - release.yml:266:25
      - release.yml:341:34
  unpinned-images:
    ignore:
      - release.yml:111:40
      - release.yml:111:66
  secrets-inherit:
    ignore:
      - release.yml:224:11
      - release.yml:282:11
  # Cargo and Bun updates deliberately wait one day (see dependabot.yml).
  dependabot-cooldown:
    config:
      days: 1
  # The `$/` self-repository syntax is newer than actionlint's parser; keep `./`.
  self-repository:
    disable: true
