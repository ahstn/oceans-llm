# zizmor audits GitHub Actions workflows (`mise run actions-audit`).
#
# release.yml is generated by cargo-dist from dist-workspace.toml, and `dist plan`
# fails when it is edited by hand. Its current findings come from the cargo-dist
# template and are ignored line by line, so regenerating the workflow or adding
# anything new to it surfaces findings again for review. Its pull request job
# only runs `dist plan`; fork pull requests get a read-only token.
rules:
  excessive-permissions:
    ignore:
      - release.yml:18
  template-injection:
    ignore:
      - release.yml:80
      - release.yml:136
      - release.yml:146
      - release.yml:150
      - release.yml:203
      - release.yml:266
      - release.yml:341
  unpinned-images:
    ignore:
      - release.yml:111
  secrets-inherit:
    ignore:
      - release.yml:224
      - release.yml:282
  # Cargo and Bun updates deliberately wait one day (see dependabot.yml).
  dependabot-cooldown:
    config:
      days: 1
  # The `$/` self-repository syntax is newer than actionlint's parser; keep `./`.
  self-repository:
    disable: true
