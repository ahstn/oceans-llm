# zizmor audits GitHub Actions workflows (`mise run actions-audit`).
#
# release.yml is generated by cargo-dist from dist-workspace.toml. It publishes
# only when an approved main push has exactly one version tag; pull requests use
# the separate read-only release-plan.yml workflow. Findings from the cargo-dist
# template are ignored by exact line and column. A finding that regeneration
# moves fails again until its entry is updated, and an unrelated finding would
# have to land on the same position to be hidden.
rules:
  # The review job's PR checkout is data-only. The executable checkout is pinned
  # to the base SHA, and check-ci-trust-boundaries.sh enforces that separation.
  dangerous-triggers:
    ignore:
      - oceans-review-agent.yml:6:3
  excessive-permissions:
    ignore:
      - release.yml:18:3
  template-injection:
    ignore:
      - release.yml:201:18
      - release.yml:211:15
      - release.yml:215:26
      - release.yml:215:98
      - release.yml:269:26
      - release.yml:333:25
      - release.yml:409:34
  unpinned-images:
    ignore:
      - release.yml:175:40
      - release.yml:175:66
  secrets-inherit:
    ignore:
      - release.yml:290:11
      - release.yml:349:11
  # Cargo and Bun updates deliberately wait one day (see dependabot.yml).
  dependabot-cooldown:
    config:
      days: 1
  # The `$/` self-repository syntax is newer than actionlint's parser; keep `./`.
  self-repository:
    disable: true
