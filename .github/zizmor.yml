# zizmor audits GitHub Actions workflows (`mise run actions-audit`).
#
# release.yml is generated by cargo-dist from dist-workspace.toml, and `dist plan`
# fails when it is edited by hand, so its findings are ignored here until
# cargo-dist changes its template. Only maintainers can push the release tags
# that trigger it.
rules:
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      - release.yml
  # Cargo and Bun updates deliberately wait one day (see dependabot.yml).
  dependabot-cooldown:
    config:
      days: 1
  # The `$/` self-repository syntax is newer than actionlint's parser; keep `./`.
  self-repository:
    disable: true
