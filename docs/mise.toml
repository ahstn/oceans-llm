#:schema https://mise.jdx.dev/schema/mise.json

# The docs site at https://oceans-llm.com: Nimbus on Astro, built with Bun from
# the root mise.toml. It deploys to the Cloudflare Pages project named in
# wrangler.jsonc, which also sets the build output directory.

[tasks.install]
description = "Install docs site dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the docs site locally"
depends = [":install"]
run = "bun run dev"

[tasks.build]
description = "Build the docs site into dist/"
depends = [":install"]
run = "bun run build"

[tasks.check]
description = "Type-check the docs site and run the Nimbus checks against a fresh build"
depends = [":build"]
run = ["bun run typecheck", "bunx nimbus-docs check"]

[tasks.preview]
description = "Serve the built docs site the way Cloudflare Pages does, with _headers and _redirects"
depends = [":build"]
run = "bun run preview:cf"

[tasks.deploy]
description = "Check, build and deploy the docs site to Cloudflare Pages; set CLOUDFLARE_PAGES_BRANCH to deploy a preview instead of production"
depends = [":check"]
env = { CLOUDFLARE_ACCOUNT_ID = { required = true }, CLOUDFLARE_API_TOKEN = { required = true } }
run = 'bun run deploy --branch "${CLOUDFLARE_PAGES_BRANCH:-main}"'
