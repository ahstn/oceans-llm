#:schema https://mise.jdx.dev/schema/mise.json
# Optional native RustFS dependency for mise.selfhost.toml.
# Select `selfhost,rustfs,selfhost-rustfs`; see the self-hosting runbook.
# A daemon override replaces its complete definition.

[env]
OCEANS_RUSTFS_DATA_DIR = "$HOME/.local/share/oceans-llm/rustfs/data"

[daemons.rustfs]
run = '''
set -eu
: "${RUSTFS_ACCESS_KEY:?Run mise run rustfs:setup first}"
: "${RUSTFS_SECRET_KEY:?Run mise run rustfs:setup first}"
mkdir -p "$OCEANS_RUSTFS_DATA_DIR"
export RUSTFS_CONSOLE_ENABLE=false
exec rustfs server --address "127.0.0.1:$RUSTFS_PORT" --region "$OCEANS_RUSTFS_REGION" "$OCEANS_RUSTFS_DATA_DIR"
'''
port = 9000
ready_http = { url = "http://127.0.0.1:9000/health/ready", timeout = "150s" }
boot_start = true
retry = 3
proxy = false

[daemons.rustfs-bucket]
run = "exec bash scripts/rustfs-bucket.sh"
depends = ["rustfs"]
oneshot = true
proxy = false

[daemons.gateway]
run = '''
unset EXA_API_KEY GATEWAY_ADMIN_PASSWORD GATEWAY_API_KEY GATEWAY_BOOTSTRAP_ADMIN_PASSWORD
unset GATEWAY_IDENTITY_TOKEN_SECRET GATEWAY_PUBLIC_BASE_URL OCEANS_API_KEY_SECRET_ENCRYPTION_KEY
unset OCEANS_API_PERSONAL_KEY OCEANS_MCP_DISCOVERY_EXA OCEANS_MCP_DISCOVERY_REUI
unset OPENAI_API_KEY OPENROUTER_API_KEY REUI_LICENSE_KEY
exec fnox --non-interactive exec --redact \
  --only OCEANS_API_KEY_SECRET_ENCRYPTION_KEY \
  --only GATEWAY_IDENTITY_TOKEN_SECRET \
  --only GATEWAY_BOOTSTRAP_ADMIN_PASSWORD \
  --only GATEWAY_API_KEY \
  --only GATEWAY_PUBLIC_BASE_URL \
  --only OPENROUTER_API_KEY \
  -- "$CARGO_TARGET_DIR/release/gateway" serve
'''
port = 8080
ready_http = "http://127.0.0.1:8080/readyz"
depends = ["db", "rustfs-bucket"]
boot_start = true
retry = 3
proxy = false
